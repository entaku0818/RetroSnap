<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@700;900&family=Klee+One:wght@600&family=Noto+Sans+JP:wght@500;700&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1320px;height:2868px;overflow:hidden}
  body{background:#efe4d0;position:relative;font-family:"Noto Sans JP",sans-serif;color:#3b2a1e}
  /* 紙の粒状感 */
  body::before{content:"";position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/><feColorMatrix values='0 0 0 0 .45  0 0 0 0 .35  0 0 0 0 .25  0 0 0 .5 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
  .stamp{position:absolute;top:150px;left:110px;font-family:"Noto Sans JP";font-weight:700;letter-spacing:.18em;color:#e8642c;font-size:40px}
  h1{position:absolute;top:220px;left:104px;margin:0;font-family:"Zen Old Mincho",serif;font-weight:900;font-size:128px;line-height:1.22;letter-spacing:.02em}
  .sub{position:absolute;top:560px;left:110px;font-size:46px;font-weight:500;line-height:1.6;color:#6b5240}
  .phone{position:absolute;left:96px;top:820px;width:700px;height:1521px;border-radius:118px;background:#1b1512;padding:22px;box-sizing:border-box;
    transform:rotate(-4deg);box-shadow:0 40px 80px rgba(60,35,15,.35)}
  .phone img{width:100%;height:100%;object-fit:cover;border-radius:96px;display:block}
  .print{position:absolute;background:#fbf7ef;padding:22px 22px 86px;box-shadow:0 22px 44px rgba(60,35,15,.3);width:370px}
  .print img{width:100%;height:420px;object-fit:cover;display:block}
  .print span{position:absolute;bottom:22px;left:0;right:0;text-align:center;font-family:"Klee One";font-size:40px;color:#4a3626}
  .p1{left:790px;top:860px;transform:rotate(6deg)}
  .p2{left:845px;top:1440px;transform:rotate(-5deg)}
  .p3{left:800px;top:2000px;transform:rotate(4deg)}
  .strip{position:absolute;left:0;right:0;bottom:0;height:300px;background:#2a1f19;display:flex;align-items:center;justify-content:center;gap:26px}
  .strip::before,.strip::after{content:"";position:absolute;left:0;right:0;height:26px;
    background:repeating-linear-gradient(90deg,transparent 0 22px,#efe4d0 22px 48px,transparent 48px 70px)}
  .strip::before{top:18px}.strip::after{bottom:18px}
  .strip div{width:210px;height:170px;position:relative}
  .strip img{width:100%;height:100%;object-fit:cover;display:block}
  .strip b{position:absolute;bottom:-1px;left:0;right:0;font-size:22px;color:#fff;text-align:center;background:rgba(0,0,0,.45);font-weight:500}
</style></head><body>
  <div class="stamp">'26 10 01</div>
  <h1>撮るだけで、<br>フィルム写真。</h1>
  <div class="sub">5つのレトロカメラから選んで<br>シャッターを押すだけ。</div>
  <div class="phone"><img src="assets/screen-sunsetfade.jpg"></div>
  <div class="print p1"><img src="assets/photo-nightneon.jpg"><span>ナイトネオン</span></div>
  <div class="print p2"><img src="assets/photo-toyplastic.jpg"><span>トイプラスチック</span></div>
  <div class="print p3"><img src="assets/photo-plain70.jpg"><span>プレーン70</span></div>
  <div class="strip">
    <div><img src="assets/photo-plain70.jpg"><b>プレーン70</b></div>
    <div><img src="assets/photo-sunsetfade.jpg"><b>サンセット</b></div>
    <div><img src="assets/photo-nightneon.jpg"><b>ナイトネオン</b></div>
    <div><img src="assets/photo-toyplastic.jpg"><b>トイプラ</b></div>
    <div><img src="assets/photo-datestamp98.jpg"><b>デート98</b></div>
  </div>
</body></html>
