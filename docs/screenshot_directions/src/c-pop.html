<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@700;800&display=block" rel="stylesheet">
<style>
  html,body{margin:0;width:1320px;height:2868px;overflow:hidden}
  body{position:relative;font-family:"M PLUS Rounded 1c",sans-serif;color:#2b1a4a;
    background:radial-gradient(circle at 15% 10%,#ffd1ec 0,transparent 45%),radial-gradient(circle at 90% 35%,#c9f7e1 0,transparent 40%),radial-gradient(circle at 20% 85%,#d9ccff 0,transparent 45%),#fbe7ff}
  body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff 3px,transparent 3.5px);background-size:44px 44px;opacity:.55}
  h1{position:absolute;top:170px;left:0;right:0;margin:0;text-align:center;font-family:"Dela Gothic One";font-weight:400;font-size:132px;line-height:1.18;color:#ff3d9a;
    -webkit-text-stroke:3px #2b1a4a;paint-order:stroke fill;text-shadow:7px 7px 0 #2b1a4a}
  .sub{position:absolute;top:520px;left:0;right:0;text-align:center;font-size:50px;font-weight:800}
  .sub em{font-style:normal;background:#fff35c;padding:0 14px;border-radius:12px}
  .phone{position:absolute;left:300px;top:720px;width:720px;height:1565px;border-radius:120px;background:#2b1a4a;padding:22px;box-sizing:border-box;transform:rotate(3deg);
    box-shadow:22px 22px 0 #ff3d9a}
  .phone img{width:100%;height:100%;object-fit:cover;border-radius:98px;display:block}
  .pol{position:absolute;background:#fff;padding:18px 18px 70px;width:330px;border:5px solid #2b1a4a;border-radius:18px;box-shadow:12px 12px 0 #2b1a4a}
  .pol img{width:100%;height:370px;object-fit:cover;display:block;border-radius:8px}
  .pol span{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:36px;font-weight:800}
  .q1{left:40px;top:1000px;transform:rotate(-9deg)}
  .q2{left:950px;top:1240px;transform:rotate(8deg)}
  .q3{left:60px;top:1900px;transform:rotate(-4deg)}
  .badge{position:absolute;font-family:"Dela Gothic One";font-size:48px;padding:26px 40px;border:5px solid #2b1a4a;border-radius:999px;box-shadow:8px 8px 0 #2b1a4a}
  .b1{left:880px;top:840px;background:#c9f7e1;transform:rotate(10deg)}
  .b2{left:890px;top:2060px;background:#fff35c;transform:rotate(-6deg)}
  .spark{position:absolute;font-size:110px;color:#fff;-webkit-text-stroke:5px #2b1a4a}
  .bottom{position:absolute;bottom:120px;left:0;right:0;text-align:center;font-size:44px;font-weight:800}
  .bottom span{display:inline-block;background:#2b1a4a;color:#fff;border-radius:999px;padding:18px 44px}
</style></head><body>
  <h1>撮るだけで<br>エモ写真！</h1>
  <div class="sub"><em>5つのレトロカメラ</em>で、ワンタップ撮影</div>
  <div class="phone"><img src="assets/screen-toyplastic.jpg"></div>
  <div class="pol q1"><img src="assets/photo-nightneon.jpg"><span>ネオン</span></div>
  <div class="pol q2"><img src="assets/photo-sunsetfade.jpg"><span>サンセット</span></div>
  <div class="pol q3"><img src="assets/photo-plain70.jpg"><span>プレーン70</span></div>
  <div class="badge b1">光漏れ</div>
  <div class="badge b2">日付入り</div>
  <div class="spark" style="left:1130px;top:560px">✦</div>
  <div class="spark" style="left:90px;top:690px">✦</div>
  <div class="spark" style="left:1150px;top:2380px">✦</div>
  <div class="bottom"><span>プレーン70・サンセット・ネオン・トイ・日付98</span></div>
</body></html>
